<head>
<meta charset="" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }}{% else %}{{ site.name }}{% endif %}</title>
<meta name="description" content="{{ site.description }}">

<link rel="profile" href="http://gmpg.org/xfn/11" />
<link rel="stylesheet" href="//netdna.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css">
<link rel="stylesheet" href="//netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css">
<link rel="stylesheet" type="text/css" media="all" href="{{ site.baseurl }}/css/style.css" />
<link rel="stylesheet" type="text/css" media="all" href="{{ site.baseurl }}/css/jquery.mmenu.all.css" />
<link rel="stylesheet" href="{{ site.baseurl }}/css/highlightjs.piperita.css">

<!-- Favicons generated at http://realfavicongenerator.net/ -->
<link rel="icon" type="image/png" href="{{ site.baseurl }}/images/site/favicons/favicon-96x96.png?v=20261107" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/images/site/favicons/favicon.svg?v=20261107" />
<link rel="shortcut icon" href="{{ site.baseurl }}/images/site/favicons/favicon.ico?v=20261107" />
<link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/images/site/favicons/apple-touch-icon.png?v=20261107" />
<link rel="manifest" href="{{ site.baseurl }}/images/site/favicons/site.webmanifest?v=20261107" />

{% if site.addthis_id %}
<!-- Go to www.addthis.com/dashboard to customize your tools -->
<script type="text/javascript" src="//s7.addthis.com/js/300/addthis_widget.js#pubid={{ site.addthis_id }}"></script>
{% endif %}

{% feed_meta %}
</head>
